aid: estimote-inc
name: Estimote Inc
description: >-
  Estimote, Inc. is a location and proximity technology company founded in 2012, with
  offices in New York City and Kraków, Poland. Estimote designs small wireless sensors and
  beacons that leverage modern IoT radio technologies — Bluetooth Low Energy (BLE), Ultra
  Wideband (UWB), and cellular LTE-M / NB-IoT — to bring precise indoor and outdoor
  positioning, proximity detection, and asset tracking to physical spaces. Its current
  flagship product, UWB Tags, are programmable in JavaScript via a web IDE and can push
  events directly to the cloud over LTE. For developers, Estimote exposes the Estimote
  Cloud RESTful API (device and attachment management, fleet configuration, and LTE Beacon
  event history), OAuth 2.0 authorization, serverless cloud code, and a family of
  first-party iOS and Android SDKs (Proximity, Positioning, UWB, Indoor, Fleet Management).
  Estimote has deployed millions of sensors worldwide for clients including Apple, Amazon,
  Nike, and NASA.
