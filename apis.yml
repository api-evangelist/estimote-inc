  description: >-
    The Estimote Cloud RESTful API lets you programmatically read and update settings for
    your beacon fleet (Devices and Attachments APIs), manage pending settings for remote
    fleet updates, access LTE Beacon event history, and enqueue user messages. Responses
    are JSON. Authentication is via OAuth 2.0 (authorization code grant) or App tokens.
